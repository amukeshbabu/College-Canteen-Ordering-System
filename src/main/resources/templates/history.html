<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order History')}"></head>
<body>

    <nav th:replace="~{fragments :: navbar('history')}"></nav>

    <div class="main-wrapper">

        <!-- Pattern status header bar -->
        <div th:replace="~{fragments :: patternBar}"></div>

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Complete Order History</h1>
                <p class="page-subtitle">Centralized Order Audit • Managed by Singleton instance <strong>OrderManager</strong></p>
            </div>
            <div>
                <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.6rem 1.2rem; text-align: right;">
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Total Revenue Managed:</span>
                    <div style="font-size: 1.4rem; font-weight: 800; color: var(--accent-green);" th:text="'₹' + ${#numbers.formatDecimal(totalRevenue, 1, 2)}">₹0.00</div>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Food Item</th>
                        <th>Factory Implementation</th>
                        <th>Unit Price</th>
                        <th>Qty</th>
                        <th>Total Price</th>
                        <th>Final Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}" th:if="${!orders.empty}">
                        <td th:text="'#' + ${order.orderId}">#101</td>
                        <td><strong th:text="${order.foodItem.name}">Veg Meals</strong></td>
                        <td>
                            <span class="pattern-tag" style="margin: 0; padding: 0.2rem 0.5rem; font-size: 0.75rem;" th:text="${order.foodItem.class.simpleName}">VegMeals</span>
                        </td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(order.foodItem.price, 1, 2)}">₹100.00</td>
                        <td th:text="${order.quantity}">2</td>
                        <td style="font-weight: 700; color: var(--accent-orange);" th:text="'₹' + ${#numbers.formatDecimal(order.totalPrice, 1, 2)}">₹200.00</td>
                        <td>
                            <span class="status-badge" th:classappend="'status-' + ${order.status}" th:text="${order.status}">COMPLETED</span>
                        </td>
                    </tr>
                    <tr th:if="${orders.empty}">
                        <td colspan="7" class="empty-state">
                            <div class="empty-icon">📜</div>
                            <p>No orders recorded in history yet.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
